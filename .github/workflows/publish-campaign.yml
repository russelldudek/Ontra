name: Publish complete candidate campaign

on:
  push:
    branches: [main]
    paths:
      - campaign.part00
      - campaign.part01.correct
      - campaign.part02
      - campaign.part03
      - campaign.part04
      - campaign.part05
      - .publish-trigger
      - .github/workflows/publish-campaign.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify and expand complete campaign
        shell: bash
        run: |
          set -euo pipefail
          cat campaign.part00 campaign.part01.correct campaign.part02 campaign.part03 campaign.part04 campaign.part05 > /tmp/ontra-campaign.b64
          base64 --decode /tmp/ontra-campaign.b64 > /tmp/ontra-campaign.tar.gz
          gzip -t /tmp/ontra-campaign.tar.gz
          tar -tzf /tmp/ontra-campaign.tar.gz > /tmp/ontra-manifest.txt
          grep -Fxq './index.html' /tmp/ontra-manifest.txt
          grep -Fxq './resume.html' /tmp/ontra-manifest.txt
          grep -Fxq './cover-letter.html' /tmp/ontra-manifest.txt
          grep -Fxq './docs/Russell-Dudek-Ontra-Resume.pdf' /tmp/ontra-manifest.txt

          git rm -rf .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/ontra-campaign.tar.gz -C .

      - name: Commit complete publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish complete Ontra candidate campaign'
          git push origin HEAD:main
