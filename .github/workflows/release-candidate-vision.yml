name: Publish audited candidate vision

on:
  push:
    branches: [main]
    paths:
      - '.release/ontra-v3.tar.gz.b64'

permissions:
  contents: write

concurrency:
  group: ontra-candidate-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand reviewed source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .release/ontra-v3.tar.gz.b64 >/tmp/ontra-v3.tar.gz
          echo '209a843a5a27ac906abd811bd889dcec36314059d60c9093b65083eca57bb7d7  /tmp/ontra-v3.tar.gz' | sha256sum -c -
          mkdir -p /tmp/ontra-v3
          tar -xzf /tmp/ontra-v3.tar.gz -C /tmp/ontra-v3
          for path in index.html app.js styles.css brand-tokens.css documents.css resume.html cover-letter.html interview-brief.html 120-day-plan.html ai-operating-precedent.html README.md brand-intelligence.md campaign-audit.md; do
            test -s "/tmp/ontra-v3/$path"
            cp "/tmp/ontra-v3/$path" "$path"
          done
          test -s assets/brand/ontra-horizontal-black.png
          rm -f simplified.css docs/Russell-Dudek-Ontra-AI-Operating-Precedent.pdf
          mkdir -p docs

      - name: Install browser and PDF tools
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet pymupdf

      - name: Render and audit candidate vision
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/ontra-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
          cat >/tmp/audit.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const viewports = [[1440,900],[1280,800],[768,1024],[390,844],[320,800]];
            for (const [width,height] of viewports) {
              const page = await browser.newPage({viewport:{width,height}});
              const errors=[];
              page.on('pageerror', e=>errors.push(String(e)));
              page.on('console', m=>{if(m.type()==='error')errors.push(m.text())});
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
              await page.waitForTimeout(900);
              const result=await page.evaluate(() => {
                const d=document.documentElement;
                const overflow=Math.max(d.scrollWidth,document.body.scrollWidth)-innerWidth;
                const bad=[...document.querySelectorAll('body *')].filter(el=>{const r=el.getBoundingClientRect(),c=getComputedStyle(el);return r.width>1&&r.height>1&&c.position!=='fixed'&&(r.left < -1 || r.right > innerWidth+1)}).length;
                const whiteFixed=[...document.querySelectorAll('body *')].filter(el=>{const r=el.getBoundingClientRect(),c=getComputedStyle(el);return c.position==='fixed'&&r.width>10&&r.height>10&&c.backgroundColor==='rgb(255, 255, 255)'}).length;
                const logo=document.querySelector('.company-lockup img');
                return {overflow,bad,whiteFixed,buttons:document.querySelectorAll('button').length,logoWidth:logo?.naturalWidth||0};
              });
              if(errors.length||result.overflow>1||result.bad||result.whiteFixed||result.buttons!==1||result.logoWidth<1) throw new Error(`${width}x${height} failed: ${JSON.stringify({errors,result})}`);
              const button=page.locator('.transfer-button');
              await button.click();
              if(await button.getAttribute('aria-expanded')!=='true'||!(await page.locator('#transfer-test').isVisible())) throw new Error(`Transfer test failed at ${width}x${height}`);
              await page.screenshot({path:`/tmp/site-${width}.png`,fullPage:true});
              await page.close();
            }
            const reduced=await browser.newPage({viewport:{width:390,height:844},reducedMotion:'reduce'});
            await reduced.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
            const states=await reduced.locator('.capability-path li').evaluateAll(els=>els.map(el=>({o:getComputedStyle(el).opacity,t:getComputedStyle(el).transform})));
            if(states.some(s=>s.o!=='1'||s.t!=='none')) throw new Error(`Reduced motion failed: ${JSON.stringify(states)}`);
            await reduced.close();
            const documents=['resume.html','cover-letter.html','interview-brief.html','120-day-plan.html','ai-operating-precedent.html'];
            for(const route of documents){
              for(const [width,height] of [[1440,900],[390,844],[320,800]]){
                const page=await browser.newPage({viewport:{width,height}});
                await page.goto(`http://127.0.0.1:4173/${route}`,{waitUntil:'networkidle'});
                const overflow=await page.evaluate(()=>Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth);
                if(overflow>1)throw new Error(`${route} overflow at ${width}`);
                await page.close();
              }
            }
            const page=await browser.newPage();
            const jobs=[
              ['resume.html','docs/Russell-Dudek-Ontra-Resume.pdf'],
              ['cover-letter.html','docs/Russell-Dudek-Ontra-Cover-Letter.pdf'],
              ['interview-brief.html','docs/Russell-Dudek-Ontra-Interview-Thesis-Brief.pdf'],
              ['120-day-plan.html','docs/Russell-Dudek-Ontra-120-Day-Plan.pdf'],
              ['ai-operating-precedent.html','docs/Russell-Dudek-Ontra-AI-Capability-Charter.pdf']
            ];
            for(const [route,out] of jobs){
              await page.goto(`http://127.0.0.1:4173/${route}`,{waitUntil:'networkidle'});
              await page.pdf({path:out,printBackground:true,preferCSSPageSize:true,margin:{top:'0',right:'0',bottom:'0',left:'0'}});
            }
            await page.close();
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/audit.js

      - name: Verify PDFs and public-source integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(pdfinfo docs/Russell-Dudek-Ontra-Resume.pdf | awk '/Pages:/{print $2}')" = '2'
          test "$(pdfinfo docs/Russell-Dudek-Ontra-Cover-Letter.pdf | awk '/Pages:/{print $2}')" = '1'
          test "$(pdfinfo docs/Russell-Dudek-Ontra-Interview-Thesis-Brief.pdf | awk '/Pages:/{print $2}')" = '2'
          test "$(pdfinfo docs/Russell-Dudek-Ontra-120-Day-Plan.pdf | awk '/Pages:/{print $2}')" = '2'
          test "$(pdfinfo docs/Russell-Dudek-Ontra-AI-Capability-Charter.pdf | awk '/Pages:/{print $2}')" = '1'
          w=$(pdfinfo docs/Russell-Dudek-Ontra-AI-Capability-Charter.pdf | awk '/Page size:/{print $3}')
          h=$(pdfinfo docs/Russell-Dudek-Ontra-AI-Capability-Charter.pdf | awk '/Page size:/{print $5}')
          awk -v w="$w" -v h="$h" 'BEGIN{exit !(w>h)}'
          python - <<'PY'
          import fitz,glob,re,sys
          for path in glob.glob('docs/*.pdf'):
              doc=fitz.open(path)
              sizes=[]
              text=[]
              for page in doc:
                  text.append(page.get_text())
                  for block in page.get_text('dict')['blocks']:
                      for line in block.get('lines',[]):
                          for span in line.get('spans',[]):
                              if span['text'].strip(): sizes.append(span['size'])
              if min(sizes,default=99)<7.9: raise SystemExit(f'{path}: minimum type {min(sizes)}')
              if re.search(r'role[\s-]*forge','\n'.join(text),re.I): raise SystemExit(f'{path}: prohibited internal term')
          PY
          ! grep -RilE 'role[[:space:]-]*forge|bounded practice|AI Operating Precedent|Turn each AI intervention|Mia' --include='*.html' --include='*.css' --include='*.js' --include='*.md' .
          grep -q 'Turn scattered AI effort into' index.html
          grep -q 'AI Capability Charter' interview-brief.html
          grep -q 'AI Capability Charter' ai-operating-precedent.html
          grep -q 'Independent candidate vision by Russell Dudek' index.html

      - name: Publish clean main tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release .github/workflows/release-candidate-vision.yml node_modules package.json package-lock.json
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish mobile-first Ontra candidate vision'
          git push origin HEAD:main
